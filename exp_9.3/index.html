<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Full-Stack AWS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌐 AWS Load-Balanced Full-Stack App</h1>
    <p>Frontend served via AWS S3 + CloudFront, API behind an Application Load Balancer</p>
  </header>

  <main>
    <section class="card">
      <h2>Add a Product</h2>
      <form id="form">
        <input id="name" placeholder="Product name" required />
        <input id="price" placeholder="Price" type="number" step="0.01" required />
        <button>Add</button>
      </form>
    </section>

    <section class="card">
      <h2>Product List</h2>
      <ul id="list"></ul>
    </section>
  </main>

  <footer>© 2025 AWS Demo App</footer>
  <script src="app.js"></script>
</body>
</html>
